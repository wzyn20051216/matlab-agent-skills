name: MATLAB Validation

# 层 B：官方 MATLAB 环境（有许可证）。这一层才会真的启动 MATLAB、真的跑 Simulink、真的调 Coder。
#
# 关于"哪些其实没验证"：
#   - 本 workflow 只申请 MATLAB + Simulink 两个产品。MATLAB Coder / Simulink Coder 没被安装，
#     对应的检查项会输出 SKIP 并写明原因，绝不冒充 PASS。
#   - 需要 Pro 许可证、硬件板卡、外部工具链（Keil / STM32CubeMX / IAR）的检查属于层 C，
#     不在本 workflow 执行，见文件末尾 layer-c 的说明。

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      timeout_seconds:
        description: '单个 MATLAB 批处理阶段的最长运行秒数'
        required: false
        default: '1800'
      include_coder_products:
        description: '尝试安装 MATLAB Coder / Simulink Coder（需要许可证覆盖这两个产品）'
        type: choice
        options:
          - 'false'
          - 'true'
        default: 'false'

jobs:
  matlab-tests:
    name: 层 B - 真实 MATLAB 执行
    runs-on: windows-latest
    # 真跑 MATLAB 必须有许可证；没有就明确失败/跳过，不允许静默通过。
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: latest
          products: >
            MATLAB
            Simulink
            ${{ github.event.inputs.include_coder_products == 'true' && 'MATLAB Coder Simulink Coder' || '' }}

      - name: Confirm MATLAB is visible to PowerShell
        shell: pwsh
        run: |
          Import-Module ./scripts/MatlabAgentSkills.Execution.psm1 -Force -DisableNameChecking
          $exe = Resolve-MatlabExecutable
          if (-not $exe) { throw "已安装 MATLAB 但解析不到可执行文件，本层无法执行" }
          $info = Get-MatlabInstallInfo -ExecutablePath $exe
          "matlab: $exe"
          "release: $($info.Release)"
          "version: $($info.Version)"

      - name: Run real-execution tests (matlab layer)
        shell: pwsh
        run: ./tests/Invoke-Tests.ps1 -Layer matlab -CI
        env:
          TIMEOUT_SECONDS: ${{ github.event.inputs.timeout_seconds || '1800' }}

      - name: Run MATLAB skill acceptance suite
        shell: pwsh
        run: |
          $timeout = [int]$env:TIMEOUT_SECONDS
          ./scripts/Test-MatlabSkills.ps1 -TimeoutSeconds $timeout -OutputPath 'artifacts/validation/acceptance_report.json'
        env:
          TIMEOUT_SECONDS: ${{ github.event.inputs.timeout_seconds || '1800' }}

      - name: Verify acceptance report is schema-valid and truthful
        if: always()
        shell: pwsh
        run: |
          Import-Module ./scripts/MatlabAgentSkills.Acceptance.psm1 -Force -DisableNameChecking
          $path = 'artifacts/validation/acceptance_report.json'
          if (-not (Test-Path -LiteralPath $path)) {
            throw "没有产出验收报告 $path：本层实际未完成，不能视为通过"
          }
          $report = Import-AcceptanceReport -Path $path
          $result = Test-AcceptanceReport -Report $report
          if (-not $result.Valid) {
            $result.Errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
          $report.checks | ForEach-Object {
            "{0,-34} {1,-5} L{2} {3}" -f $_.id, $_.status, $_.level, $_.reason
          }
          "overallStatus = $($report.overallStatus)"
          "achievedLevel = $($report.achievedLevel)"
          if ($report.overallStatus -eq 'FAIL' -or $report.overallStatus -eq 'SKIP') {
            Write-Error "验收未通过（$($report.overallStatus)）：见上方各检查项的 reason"
            exit 1
          }

      - name: Upload MATLAB artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matlab-validation-artifacts
          path: |
            artifacts
          if-no-files-found: warn

# 层 C 说明（有意不在本文件里实现成默认 job）：
#
#   需要以下条件的检查无法在公共 runner 上完成，属于层 C：
#     1. MATLAB Coder / Simulink Coder / Embedded Coder 的编译产物验证（需要覆盖这些产品的许可证）
#     2. STM32 目标硬件的下载与回读（需要板卡、调试器、串口回读通道）
#     3. 外部工具链（Keil MDK / IAR / STM32CubeMX）的集成验证
#
#   这些检查在层 B 的验收报告里以 SKIP 出现，并带有明确的 skip 原因。
#   报告不会因为"检查项被跳过"而把 overallStatus 判成 PASS —— 只要存在 SKIP，
#   整体状态就是 SKIP（退出码 3），achievedLevel 也停在第一个不连续的等级之前。
#
#   如需执行层 C，请在受控 runner 上手动运行：
#     ./scripts/Test-MatlabEmbeddedStack.ps1 -TimeoutSeconds 3600
#   并在 PR 描述里贴出该次运行的验收报告，而不是引用层 B 的结果。
