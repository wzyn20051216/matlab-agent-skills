name: Repository Checks

# 层 A：免费环境。不需要 MATLAB 许可证，不需要 MCP 服务端，不需要硬件。
# 只验证"代码本身是否自洽"：语法、编码、路径卫生、验收协议、错误分类、MCP 探测逻辑。
# 这一层通过 ≠ MATLAB 真的能跑；它只证明执行引擎的设计与模拟场景是正确的。

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  static-checks:
    name: 层 A - 静态检查
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Include *.ps1, *.psm1 -File | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors) {
              $failed = $true
              Write-Error "PowerShell parse errors in $($_.FullName): $($errors | Out-String)"
            }
          }
          if ($failed) { exit 1 }

      - name: Check UTF-8 BOM on PowerShell scripts with non-ASCII content
        shell: pwsh
        run: |
          # Windows PowerShell 5.1 decodes BOM-less files as ANSI, which breaks Chinese text.
          $bad = @()
          Get-ChildItem -Recurse -Include *.ps1, *.psm1 -File | ForEach-Object {
            $bytes = [System.IO.File]::ReadAllBytes($_.FullName)
            $text = [System.IO.File]::ReadAllText($_.FullName)
            if ($text -match '[^\x00-\x7F]') {
              $hasBom = ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF)
              if (-not $hasBom) { $bad += $_.FullName }
            }
          }
          if ($bad) {
            $bad | ForEach-Object { "Missing UTF-8 BOM (Windows PowerShell 5.1 cannot parse): $_" }
            exit 1
          }

      - name: Check for machine-specific paths in tracked text files
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -File |
            Where-Object { $_.Name -ne "repository-checks.yml" } |
            Where-Object { $_.FullName -notmatch '[\\/](\.git|artifacts|bin)[\\/]' } |
            Where-Object { $_.Extension -in '.md', '.ps1', '.psm1', '.m', '.json', '.yml', '.yaml', '.txt' } |
            Select-Object -ExpandProperty FullName

          $matches = Select-String -Path $files -Pattern 'C:\\Users\\[^<]|[ED]:\\' -AllMatches
          if ($matches) {
            $matches | ForEach-Object {
              "{0}:{1}:{2}" -f $_.Path, $_.LineNumber, $_.Line.Trim()
            }
            exit 1
          }

      - name: Validate acceptance JSON schema is well-formed
        shell: pwsh
        run: |
          $schemaPath = Join-Path $PWD 'schemas/acceptance-report.schema.json'
          if (-not (Test-Path -LiteralPath $schemaPath)) { throw "缺少 schemas/acceptance-report.schema.json" }
          Import-Module ./scripts/MatlabAgentSkills.Acceptance.psm1 -Force -DisableNameChecking
          # 必须按 UTF-8 读取：PowerShell 5.1 的 Get-Content 会把中文说明按 ANSI 解码成乱码。
          $schema = Read-AcceptanceJsonFile -Path $schemaPath
          "schema draft: $($schema.'$schema')"
          "schema version field: $($schema.properties.schemaVersion.const)"
          "required top-level fields: $($schema.required -join ', ')"

  free-tests:
    name: 层 A - 免费测试（${{ matrix.shell }}）
    runs-on: windows-latest
    # 同一套用例在两个 PowerShell 运行面上各跑一次：
    # 5.1 与 7 的 JSON 日期解析、异常语义、字符串比较都不同，只测一个版本
    # 会出现"本机全绿、CI 全红"（本仓库真实踩过）。fail-fast 关掉，
    # 这样一次就能看到两个版本各自的结果。
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Ensure Pester 3.4.0 is available
        shell: pwsh
        run: |
          # 测试套件使用 Pester 3 的 Should 语法。runner 上同时存在 3.4.0 与 5.9.0，
          # 曾经因为"取最高版本"选中 5.9.0，导致 124 个用例全部以语法不支持失败。
          $required = '3.4.0'
          $found = Get-Module -ListAvailable Pester | Where-Object { "$($_.Version)" -eq $required }
          if (-not $found) {
            Install-Module Pester -RequiredVersion $required -Scope CurrentUser -Force -SkipPublisherCheck
            $found = Get-Module -ListAvailable Pester | Where-Object { "$($_.Version)" -eq $required }
          }
          if (-not $found) { throw "无法准备 Pester $required" }
          "Pester $required ready: $($found[0].Path)"
          Get-Module -ListAvailable Pester | Select-Object Name, Version | Format-Table | Out-String

      - name: Run free-layer tests
        shell: ${{ matrix.shell }}
        run: ./tests/Invoke-Tests.ps1 -Layer free -CI -PesterVersion 3.4.0

      - name: Publish layer report to job summary
        if: always()
        shell: pwsh
        run: |
          $reportPath = 'artifacts/validation/tests/layer_report.json'
          if (-not (Test-Path -LiteralPath $reportPath)) { throw "缺少层报告 $reportPath" }
          $report = Get-Content -Raw -LiteralPath $reportPath | ConvertFrom-Json
          $lines = @(
            '### 测试层执行情况',
            '',
            "运行面：PowerShell $($report.powerShellVersion) ($($report.powerShellEdition))，Pester $($report.pesterVersion)",
            '',
            '| 层 | 是否执行 | 用例 | 通过 | 失败 | 说明 |',
            '| --- | --- | --- | --- | --- | --- |'
          )
          foreach ($layer in $report.layers) {
            $executed = if ($layer.executed) { '已执行' } else { '**未执行**' }
            $reason = if ($layer.reason) { $layer.reason } else { '' }
            $lines += "| $($layer.layer) | $executed | $($layer.total) | $($layer.passed) | $($layer.failed) | $reason |"
          }
          $lines += ''
          $lines += '> 本 job 不安装 MATLAB。`matlab` 层（真实 MATLAB 执行、Simulink 仿真、Coder 编译）'
          $lines += '> 由 MATLAB Validation workflow 在带许可证的环境里执行；它没跑过就不代表已验证。'
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload layer report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-layer-report-${{ matrix.shell }}
          path: artifacts/validation/tests/layer_report.json
          if-no-files-found: error
